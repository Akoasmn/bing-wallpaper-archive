name: Collect wallpapers and publish Pages

on:
  push:
  schedule:
    # 00:17 and 04:17 in Asia/Shanghai.
    - cron: '17 16,20 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: Fetch a wallpaper before publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wallpaper-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      ARCHIVE_DIR: .archive
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Load the archive branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/archive; then
            git fetch --no-tags --depth=1 origin refs/heads/archive
            base=FETCH_HEAD
          elif [[ $? == 2 ]]; then
            tree=$(git mktree </dev/null)
            base=$(git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit-tree "$tree" -m 'Initialize wallpaper archive')
          else
            exit 1
          fi
          git worktree add --detach "$ARCHIVE_DIR" "$base"
      - name: Collect and save to GitHub
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        shell: bash
        run: |
          pnpm collect
          git -C "$ARCHIVE_DIR" add --all -- images metadata
          if ! git -C "$ARCHIVE_DIR" diff --cached --quiet; then
            git -C "$ARCHIVE_DIR" -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m 'Archive Bing wallpaper'
            archive_commit=$(git -C "$ARCHIVE_DIR" rev-parse HEAD)
            git push origin "$archive_commit:refs/heads/archive"
          fi
      - name: Build from the archived snapshot
        run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
